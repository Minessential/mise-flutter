name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

env:
  # Keep only settings that are safe for jdx/mise-action. Do not point
  # MISE_DATA_DIR at the workspace on Windows: the action installs mise from
  # the runner's temp directory and a cross-drive rename fails with EXDEV.
  # The test scripts set their own isolated MISE_* directories.
  MISE_USE_VERSIONS_HOST: "0"
  MISE_YES: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: 2026.11.4
      - run: mise run lint

  fixture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: jdx/mise-action@v2
        with:
          version: 2026.11.4
          install: false
      - run: bash tests/integration.sh

  real-index:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: jdx/mise-action@v2
        with:
          version: 2026.11.4
          install: false
      - run: bash tests/real-index.sh

  real-install:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        bootstrap: ["false", "true"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: jdx/mise-action@v2
        with:
          version: 2026.11.4
          install: false
      - uses: actions/cache@v4
        with:
          path: |
            .tmp/real-install-${{ matrix.bootstrap }}/data/installs
            .tmp/real-install-${{ matrix.bootstrap }}/data/downloads
            .tmp/real-install-${{ matrix.bootstrap }}/cache
          key: flutter-${{ matrix.os }}-3.47.9-${{ matrix.bootstrap }}-v1
      - run: bash tests/real-install.sh "${{ matrix.bootstrap }}"

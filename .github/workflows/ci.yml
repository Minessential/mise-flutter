name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

env:
  MISE_CONFIG_DIR: ${{ github.workspace }}/.tmp/ci/config
  MISE_DATA_DIR: ${{ github.workspace }}/.tmp/ci/data
  MISE_CACHE_DIR: ${{ github.workspace }}/.tmp/ci/cache
  MISE_STATE_DIR: ${{ github.workspace }}/.tmp/ci/state
  MISE_SYSTEM_CONFIG_DIR: ${{ github.workspace }}/.tmp/ci/system
  MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.tmp/ci/global.toml
  MISE_USE_VERSIONS_HOST: "0"
  MISE_YES: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: 2026.11.4
      - run: mise run lint

  fixture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: jdx/mise-action@v2
        with:
          version: 2026.11.4
          install: false
      - run: bash tests/integration.sh

  real-index:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: jdx/mise-action@v2
        with:
          version: 2026.11.4
          install: false
      - run: bash tests/real-index.sh

  real-install:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        bootstrap: ["false", "true"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: jdx/mise-action@v2
        with:
          version: 2026.11.4
          install: false
      - uses: actions/cache@v4
        with:
          path: |
            .tmp/real-install-${{ matrix.bootstrap }}/data/installs
            .tmp/real-install-${{ matrix.bootstrap }}/data/downloads
            .tmp/real-install-${{ matrix.bootstrap }}/cache
          key: flutter-${{ matrix.os }}-3.47.9-${{ matrix.bootstrap }}-v1
      - run: bash tests/real-install.sh "${{ matrix.bootstrap }}"
